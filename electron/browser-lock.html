<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>AuraSync Guard — قفل المتصفح</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 38%, rgba(15, 23, 42, 0.92) 0%, rgba(6, 9, 19, 0.98) 60%, #020408 100%);
      color: #f1f5f9;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Noto Sans Arabic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Subtle ambient luminous aura */
    .ambient-glow {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, rgba(129, 140, 248, 0.08) 45%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
      animation: float-glow 6s infinite ease-in-out alternate;
    }

    @keyframes float-glow {
      0% { transform: scale(0.95) translateY(-8px); opacity: 0.8; }
      100% { transform: scale(1.08) translateY(8px); opacity: 1; }
    }

    /* Sleek Top Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.3px;
    }

    .brand .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse-dot 2s infinite ease;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .top-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
    }

    .top-action-btn:hover {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      transform: translateY(-1px);
    }

    /* Ultra-Smooth Minimalist Card */
    .lock-card {
      position: relative;
      z-index: 20;
      width: 340px;
      max-width: 90vw;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(56, 189, 248, 0.06);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      padding: 30px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Icon Badge */
    .icon-wrapper {
      position: relative;
      width: 54px;
      height: 54px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.4) 0%, transparent 70%);
      filter: blur(8px);
      animation: pulse-glow 3s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .icon-inner {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    h1.title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .browser-badge {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 3px 11px;
      border-radius: 999px;
    }

    .browser-badge .lock-glyph {
      font-size: 10px;
      color: #38bdf8;
    }

    /* PIN Indicator Dots */
    .dots-container {
      display: flex;
      gap: 13px;
      justify-content: center;
      align-items: center;
      margin: 18px 0 6px;
      min-height: 20px;
      direction: ltr;
    }

    .dot-cell {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dot-cell.filled {
      background: #38bdf8;
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
      transform: scale(1.18);
    }

    .dots-container.shake {
      animation: shake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    /* Error Message */
    .error-msg {
      min-height: 20px;
      font-size: 11px;
      color: #f87171;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      opacity: 0;
      transform: translateY(-2px);
      transition: all 0.16s ease;
    }

    .error-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Keypad — Fixed LTR 1-2-3 standard layout */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      justify-content: center;
      gap: 10px 14px;
      margin-top: 8px;
      direction: ltr;
    }

    .key-btn {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.035);
      color: #f8fafc;
      font-size: 23px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      outline: none;
    }

    .key-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(56, 189, 248, 0.35);
      color: #ffffff;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.15);
    }

    .key-btn:active {
      transform: scale(0.92);
      background: rgba(56, 189, 248, 0.22);
      border-color: rgba(56, 189, 248, 0.5);
      transition-duration: 0.04s;
    }

    .key-btn.action {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      font-size: 12.5px;
      font-weight: 500;
      color: #94a3b8;
    }

    .key-btn.action:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      transform: translateY(-1px);
    }

    .key-btn.action:active {
      transform: scale(0.92);
    }

    /* Subtle footer hints */
    .bottom-hint {
      margin-top: 16px;
      font-size: 10.5px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bottom-hint .key-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 9.5px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="top-bar">
    <div class="brand">
      <span class="dot"></span>
      <span>AuraSync Security Guard</span>
    </div>
    <button class="top-action-btn" id="topMinimizeBtn" title="تصغير المتصفح للأسفل (Esc)">
      <span>تصغير</span>
      <span>✕</span>
    </button>
  </div>

  <div class="lock-card">
    <div class="icon-wrapper">
      <div class="icon-glow"></div>
      <div class="icon-inner" id="browserIcon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
    </div>

    <h1 class="title">المتصفح مقفل</h1>

    <div class="browser-badge" id="browserBadge">
      <span class="lock-glyph">🔒</span>
      <span id="browserTag">Google Chrome</span>
    </div>

    <div class="dots-container" id="dotsContainer"></div>

    <div class="error-msg" id="errorMsg">⚠️ رمز PIN غير صحيح</div>

    <div class="keypad" dir="ltr">
      <button class="key-btn" data-num="1">1</button>
      <button class="key-btn" data-num="2">2</button>
      <button class="key-btn" data-num="3">3</button>
      <button class="key-btn" data-num="4">4</button>
      <button class="key-btn" data-num="5">5</button>
      <button class="key-btn" data-num="6">6</button>
      <button class="key-btn" data-num="7">7</button>
      <button class="key-btn" data-num="8">8</button>
      <button class="key-btn" data-num="9">9</button>
      <button class="key-btn action" id="cancelBtn" title="تصغير (Esc)">
        <span>إلغاء</span>
      </button>
      <button class="key-btn" data-num="0">0</button>
      <button class="key-btn action" id="backspaceBtn" title="مسح">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
          <line x1="18" y1="9" x2="12" y2="15"/>
          <line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
      </button>
    </div>

    <div class="bottom-hint">
      <span>يدعم الكيبورد مباشرة</span>
      <span>•</span>
      <span class="key-chip">Esc للتصغير</span>
    </div>
  </div>

  <script>
    let urlParams = new URLSearchParams(window.location.search);
    let browserName = urlParams.get('browser') || 'المتصفح';
    let browserIconEmoji = urlParams.get('icon') || '';
    let pinLength = parseInt(urlParams.get('pinLength') || '4', 10);

    const browserTagEl = document.getElementById('browserTag');
    const browserIconEl = document.getElementById('browserIcon');
    const dotsContainer = document.getElementById('dotsContainer');
    const errorMsg = document.getElementById('errorMsg');

    let currentPin = '';
    let isVerifying = false;

    function applyConfig(name, icon, length, pageName) {
      browserName = name || browserName;
      browserIconEmoji = icon || browserIconEmoji;
      pinLength = length || pinLength;

      if (browserTagEl) {
        browserTagEl.textContent = pageName ? `${browserName} • ${pageName}` : browserName;
      }
      if (browserIconEmoji && browserIconEl) {
        browserIconEl.innerHTML = `<span style="font-size: 24px;">${browserIconEmoji}</span>`;
      }

      const subtitleEl = document.querySelector('.card p');
      if (subtitleEl) {
        if (pageName) {
          subtitleEl.textContent = `قفل صفحة: ${pageName} • أدخل رمز الـ PIN لإلغاء القفل`;
        } else {
          subtitleEl.textContent = 'أدخل رمز الـ PIN لإلغاء القفل والمتابعة';
        }
      }

      currentPin = '';
      isVerifying = false;
      dotsContainer.innerHTML = '';
      for (let i = 0; i < pinLength; i++) {
        const cell = document.createElement('div');
        cell.className = 'dot-cell';
        dotsContainer.appendChild(cell);
      }
      errorMsg.classList.remove('show');
      dotsContainer.classList.remove('shake');
    }

    applyConfig(browserName, browserIconEmoji, pinLength);

    // Warm-up prepare listener for 0ms transitions
    if (window.electronAPI && window.electronAPI.onBrowserGuardPrepare) {
      window.electronAPI.onBrowserGuardPrepare((data) => {
        if (data) {
          applyConfig(data.browser, data.icon, parseInt(data.pinLength || '4', 10), data.pageName);
        }
      });
    }

    function updateDots() {
      const cells = dotsContainer.querySelectorAll('.dot-cell');
      cells.forEach((cell, idx) => {
        cell.classList.toggle('filled', idx < currentPin.length);
      });
    }

    async function submitPin() {
      if (currentPin.length !== pinLength || isVerifying) return;
      isVerifying = true;
      try {
        if (window.electronAPI && window.electronAPI.browserGuardVerifyPin) {
          const res = await window.electronAPI.browserGuardVerifyPin(currentPin);
          const isValid = typeof res === 'object' ? res.success : Boolean(res);
          if (isValid) {
            await window.electronAPI.browserGuardUnlock();
            return;
          }
          if (typeof res === 'object' && res.lockedOut) {
            errorMsg.textContent = '🚨 تم قفل النظام لحماية جهازك (Win + L)';
            errorMsg.classList.add('show');
            dotsContainer.classList.add('shake');
            currentPin = '';
            updateDots();
            return;
          }
          const attemptsLeft = typeof res === 'object' && res.attemptsLeft !== undefined ? res.attemptsLeft : null;
          triggerError(attemptsLeft);
          return;
        }
        triggerError();
      } catch (err) {
        triggerError();
      } finally {
        isVerifying = false;
      }
    }

    function triggerError(attemptsLeft) {
      if (attemptsLeft === 1) {
        errorMsg.textContent = '⚠️ رمز غير صحيح • متبقي محاولة أخيرة (1)';
      } else if (attemptsLeft !== null && attemptsLeft !== undefined) {
        errorMsg.textContent = `⚠️ الرمز غير صحيح • متبقي ${attemptsLeft} محاولات`;
      } else {
        errorMsg.textContent = '⚠️ رمز PIN غير صحيح';
      }
      errorMsg.classList.add('show');
      dotsContainer.classList.add('shake');
      currentPin = '';
      updateDots();
      setTimeout(() => {
        errorMsg.classList.remove('show');
        dotsContainer.classList.remove('shake');
      }, 1600);
    }

    function addDigit(digit) {
      if (currentPin.length >= pinLength || isVerifying) return;
      currentPin += digit;
      updateDots();
      if (currentPin.length === pinLength) {
        setTimeout(submitPin, 70);
      }
    }

    function removeDigit() {
      if (currentPin.length > 0 && !isVerifying) {
        currentPin = currentPin.slice(0, -1);
        updateDots();
      }
    }

    document.querySelectorAll('.key-btn[data-num]').forEach(btn => {
      btn.addEventListener('click', () => {
        addDigit(btn.getAttribute('data-num'));
      });
    });

    const backspaceBtn = document.getElementById('backspaceBtn');
    if (backspaceBtn) backspaceBtn.addEventListener('click', removeDigit);

    const cancelBtn = document.getElementById('cancelBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', handleCancel);

    const topMinimizeBtn = document.getElementById('topMinimizeBtn');
    if (topMinimizeBtn) topMinimizeBtn.addEventListener('click', handleCancel);

    async function handleCancel() {
      if (window.electronAPI && window.electronAPI.browserGuardMinimize) {
        await window.electronAPI.browserGuardMinimize();
      } else if (window.electronAPI && window.electronAPI.browserGuardCloseTab) {
        await window.electronAPI.browserGuardCloseTab();
      } else {
        window.close();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        addDigit(e.key);
      } else if (e.key === 'Backspace') {
        removeDigit();
      } else if (e.key === 'Escape') {
        handleCancel();
      } else if (e.key === 'Enter') {
        if (currentPin.length === pinLength) {
          submitPin();
        }
      }
    });
  </script>
</body>
</html>
